# 층별 자원 대장 — 어느 층에 어떤 지도와 waypoint 가 짝인가.
#
# 이 파일 하나가 "10층 지도 + 10층 waypoint" 를 묶는다. 지금까지는 사람이
# 명령줄에 두 경로를 손으로 쳤고 **틀려도 아무도 알려주지 않았다.**
#
#   ros2 run guide_mission check_floors ~/floors.yaml     ← 현장 가기 전에
#   ros2 launch jongky_guide guide.launch.py floors:=~/floors.yaml floor:=10f
#
# 경로는 ~ 를 쓴다. 젯슨 컨테이너 안에서 돌면 /host 로 마운트된 홈이다.

# 관제 노트북 핫스팟의 SSID. 여기 붙어 있으면 건물 SSID 가 안 보이므로
# 자동 층 판정이 "모른다" 고 말하고 사람에게 묻는다. **이게 정상 구성이다** —
# VLM 이 노트북에 있어서 11층에서는 핫스팟이 전제 조건이다 (brain.py 상단).
hotspot_ssids: [jongky]

floors:
  "10f":
    label: "10층"
    order: 10
    map: ~/jongky_ws/src/jongky_navigation/maps/fastcampus_10f.yaml
    waypoints: ~/waypoints_10f.yaml
    ssid: [FASTCAMPUS_10F]
    elevator:
      board: ev1       # 엘리베이터를 타러 가는 지점 (앞에 서는 자리)
      exit: ev1        # 내려서 서 있게 되는 지점. 보통 board 와 같다
    # waypoint 이름이 내부 코드다. 화면과 음성에 쓸 이름을 여기서 준다.
    # 맵핑 중 터미널 버퍼가 새어 `wwwwwwwwwwwwwwwwwev2` 같은 이름이 실제로 있다.
    labels:
      ev1: "엘리베이터 앞"
      10a: "1004호 강의장"
      10b: "1005호 강의장"

  "11f":
    label: "11층"
    order: 11
    map: ~/jongky_ws/src/jongky_navigation/maps/fastcampus_11f.yaml
    waypoints: ~/waypoints_11f.yaml
    ssid: [FASTCAMPUS_11F]
    elevator:
      board: ev1
      exit: ev1
    labels:
      ev1: "엘리베이터 앞"
      11a: "1101호 강의장"
