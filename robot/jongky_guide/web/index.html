<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>종키 안내로봇</title>
<style>
  /* 7인치 터치스크린(보통 1024x600) 기준. 장갑 낀 손으로도 눌리게 크게 잡는다. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: system-ui, "Noto Sans KR", sans-serif;
    background: #12151c; color: #f2f4f8;
    user-select: none;
  }
  #app { height: 100%; display: flex; flex-direction: column; padding: 20px; gap: 16px; }

  header { display: flex; align-items: baseline; gap: 12px; }
  h1 { margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .sub { font-size: 15px; color: #8b93a7; }

  #message {
    font-size: 26px; font-weight: 600; padding: 18px 22px; border-radius: 14px;
    background: #1c212c; border-left: 6px solid #4b7bec; min-height: 76px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
  }
  #message.navigating { border-left-color: #f7b731; }
  #message.arrived    { border-left-color: #26de81; }
  #message.failed     { border-left-color: #fc5c65; }
  #distance { font-size: 20px; color: #8b93a7; white-space: nowrap; }

  #grid {
    flex: 1; display: grid; gap: 14px; overflow-y: auto;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    grid-auto-rows: minmax(96px, auto);
  }
  button {
    font-family: inherit; font-size: 26px; font-weight: 600; color: #f2f4f8;
    background: #2a3140; border: 2px solid #3a4354; border-radius: 14px;
    cursor: pointer; transition: transform .08s, background .15s;
  }
  button:active { transform: scale(.97); background: #4b7bec; }
  button:disabled { opacity: .4; }

  #cancel {
    font-size: 24px; padding: 18px; background: #3d2229; border-color: #7a3742;
    display: none;
  }
  #cancel.show { display: block; }

  /* 눌러서 말하기. 화면 오른쪽 아래에 크게 띄운다 — 장갑 낀 손으로도 눌리게. */
  #ptt {
    position: fixed; right: 26px; bottom: 26px;
    width: 108px; height: 108px; border-radius: 50%;
    font-size: 46px; background: #2f4a7a; border-color: #4b7bec;
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  #ptt.show { display: flex; }
  #ptt.listening {
    background: #b33939; border-color: #fc5c65;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.08); }
  }

  .empty { color: #8b93a7; font-size: 19px; line-height: 1.7; padding: 20px; }
  code { background: #1c212c; padding: 3px 7px; border-radius: 5px; font-size: 16px; }

  /* 초기 위치 화면 */
  #start-panel { display: none; }
  #start-panel.show { display: block; }
  #start-panel .hint { color: #9aa4b2; line-height: 1.7; margin: 0 0 18px; }
  #start-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  #start-grid button {
    padding: 16px 10px; font-size: 17px; border-radius: 10px;
    border: 1px solid #3a4252; background: #232936; color: #e8edf4; cursor: pointer;
  }
  #start-grid button:active { background: #2e3646; }

  /* 상태별 테두리. waiting/alert/listening 이 빠져 있어서 그 상태에서는
     테두리색이 사라졌다. */
  #message.waiting   { border-color: #c9922e; }
  #message.alert     { border-color: #cf5b4a; }
  #message.listening { border-color: #4a86cf; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>어디로 가시나요?</h1>
    <span class="sub">가고 싶은 곳을 눌러 주세요</span>
  </header>

  <div id="message">
    <span id="message-text">목적지를 선택해 주세요</span>
    <span id="distance"></span>
  </div>

  <!-- 초기 위치를 정하기 전에는 목적지 화면 대신 이게 보인다.
       AMCL 이 초기 위치를 받기 전까지 map->odom 이 안 나오고, 그러면 어떤
       목적지도 가지 않는다. 예전에는 개발 PC 에서 RViz 로 찍는 것이 유일한
       방법이었다 — 터치스크린만 있는 현장에서는 쓸 수 없었다. -->
  <div id="start-panel">
    <p class="hint">
      로봇이 지금 어디 있는지 알려 주세요.<br>
      아는 지점에 로봇을 놓고 그 이름을 누릅니다.
    </p>
    <div id="start-grid"></div>
  </div>

  <div id="grid"></div>
  <button id="cancel">안내 취소</button>
</div>
<button id="ptt" title="눌러서 말하기">🎤</button>

<script>
const grid = document.getElementById('grid');
const msgBox = document.getElementById('message');
const msgText = document.getElementById('message-text');
const distEl = document.getElementById('distance');
const cancelBtn = document.getElementById('cancel');

async function loadDestinations() {
  const res = await fetch('/api/destinations');
  const {destinations} = await res.json();

  if (!destinations.length) {
    grid.innerHTML = `<div class="empty">
      등록된 목적지가 없습니다.<br><br>
      맵핑 주행 중에 <code>teleop_key.py</code> 로 <code>w</code> 를 눌러
      강의장 앞 위치를 먼저 기록해 주세요.
    </div>`;
    return;
  }

  grid.innerHTML = '';
  for (const name of destinations) {
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.onclick = () => go(name);
    grid.appendChild(btn);
  }
}

async function go(destination) {
  const res = await fetch('/api/go', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({destination}),
  });
  if (!res.ok) {
    const {error} = await res.json();
    msgText.textContent = error || '출발하지 못했습니다';
  }
}

cancelBtn.onclick = () => fetch('/api/cancel', {method: 'POST'});

const pttBtn = document.getElementById('ptt');
pttBtn.onclick = () => fetch('/api/listen', {method: 'POST'});

// 상태 폴링. 도착·실패는 노드가 판정하므로 화면은 그대로 받아 그리기만 한다.
async function poll() {
  try {
    const s = await (await fetch('/api/status')).json();
    msgText.textContent = s.message;
    msgBox.className = s.status;
    distEl.textContent = s.status === 'navigating' && s.distance > 0
      ? `${s.distance.toFixed(1)} m 남음` : '';
    // 취소는 주행 중뿐 아니라 **사람을 기다리는 중**과 **위급 정지** 에서도
    // 눌러야 한다. 예전에는 navigating 일 때만 보여서, 정작 멈춰 선 상태에서
    // 취소할 방법이 없었다.
    cancelBtn.classList.toggle(
      'show', ['navigating', 'waiting', 'alert'].includes(s.status));

    // 초기 위치가 없으면 목적지 대신 시작 화면을 보여 준다
    const needStart = s.localized === false;
    startPanel.classList.toggle('show', needStart);
    grid.style.display = needStart ? 'none' : '';
    if (needStart) buildStart();

    if (s.follower_m > 0) distEl.textContent += `  ·  뒤 ${s.follower_m.toFixed(1)} m`;
    // 마이크는 STT 가 준비됐고 주행 중이 아닐 때만 보인다
    pttBtn.classList.toggle('show', s.can_listen && s.status !== 'navigating');
    pttBtn.classList.toggle('listening', s.status === 'listening');
    document.querySelectorAll('#grid button')
      .forEach(b => b.disabled = s.status === 'navigating');
  } catch (e) { /* 노드 재시작 중일 수 있다. 다음 주기에 다시 시도한다 */ }
}

// ── 초기 위치 ─────────────────────────────────────────────────────────────
const startPanel = document.getElementById('start-panel');
const startGrid = document.getElementById('start-grid');
let startBuilt = false;

async function buildStart() {
  if (startBuilt) return;
  const {destinations} = await (await fetch('/api/destinations')).json();
  startGrid.innerHTML = '';
  for (const name of destinations) {
    const b = document.createElement('button');
    b.textContent = name;
    b.onclick = async () => {
      const res = await fetch('/api/start-here', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({waypoint: name}),
      });
      const r = await res.json();
      if (!r.ok) alert(r.error);
    };
    startGrid.appendChild(b);
  }
  startBuilt = true;
}

loadDestinations();
buildStart();
setInterval(poll, 500);
</script>
</body>
</html>
