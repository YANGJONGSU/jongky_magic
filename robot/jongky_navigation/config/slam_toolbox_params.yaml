# ==============================================================================
# 종키 AMR — SLAM Toolbox 설정 (Online Async SLAM)
#
# RPLIDAR C1 (10 Hz, 16m 유효거리, frame: laser) 및 오도메트리 기반 맵핑.
# 좌표계 규약: map -> odom -> base_footprint -> base_link -> laser
# ==============================================================================

slam_toolbox:
  ros__parameters:
    # ── 좌표계 및 토픽 ──────────────────────────────────────────────────────────
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping  # mapping / localization

    # false 로 둘 것. 전이는 slam.launch.py 가 런치 이벤트로 직접 건다.
    # true 로 하면 노드가 bond 를 기다리는데 붙여줄 관리자가 없다.
    use_lifecycle_manager: false

    # ── 지도 격자 및 레이저 유효 범위 ───────────────────────────────────────────
    # 5cm 해상도 격자. C1 실측 최소/최대 유효 거리(0.15m ~ 16.0m) 반영
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 16.0
    minimum_time_interval: 0.05
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # ── 주기 및 성능 최적화 (Jetson Orin Nano 친화) ─────────────────────────────
    # map -> odom TF 발행 주기 (50 Hz)
    transform_publish_period: 0.02
    map_update_interval: 2.0
    throttle_scans: 1
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 16.0

    # ── 스캔 매칭 및 이동 임계값 ────────────────────────────────────────────────
    # 로봇이 10cm 이상 직진하거나 0.1 rad (~5.7도) 이상 회전할 때 새 노드 추가
    minimum_travel_distance: 0.10
    # 회전 임계를 20도로 올린다. 5.7도면 돌 때마다 노드가 쏟아지는데,
    # 회전 중 스캔은 원래 부정확해서 그래프 전체를 흔든다.
    minimum_travel_heading: 0.35
    # 매칭 품질 기준. 0.1 은 "10%만 맞아도 같은 곳" 이라 엉뚱한 노드끼리
    # 연결돼 지도가 접힌다.
    link_match_minimum_response_fine: 0.45
    link_scan_maximum_distance: 1.5
    # 긴 복도용. 3.0 이면 누적 드리프트가 그보다 커졌을 때 루프 후보 자체가
    # 안 잡혀 지도에 복도가 두 겹으로 겹친다. loop_search_space_dimension 과 맞춘다.
    loop_search_maximum_distance: 8.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.55

    # ── 상관 탐색 공간 ─────────────────────────────────────────────────────────
    # 스캔 매칭 탐색 범위. **지도가 겹쳐 그려지는 주된 원인이 여기다.**
    # 0.5m 면 로봇이 그보다 어긋났을 때 매칭에 실패하고, 그러면 오도메트리만
    # 믿고 그린다 — 회전 오차가 누적된 채로 같은 복도를 다른 위치에 겹쳐 그린다.
    correlation_search_space_dimension: 1.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # ── 루프 클로징 탐색 ───────────────────────────────────────────────────────
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # ── 스캔 매처 페널티 계수 ───────────────────────────────────────────────────
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
